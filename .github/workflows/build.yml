name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 빌드 속도 향상

      # [수정됨] gradlew에 실행 권한 부여
      - name: Make gradlew executable
        working-directory: javasignupproject # 작업 폴더 지정
        run: chmod +x ./gradlew

      # [수정됨] Gradle이 빌드, 테스트, SonarCloud 분석을 모두 처리
      - name: Build and analyze
	working-directory: javasignupproject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
        run: ./gradlew build sonarqube --info