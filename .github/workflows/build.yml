name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout your code
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      # 2. Set up Java (change '17' if you use a different version)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. [NEW STEP] Manually compile your Java code
      # This creates the 'bin' folder that SonarCloud needs
      - name: Compile Java project
        run: |
          mkdir -p bin
          javac -d bin -cp "lib/*" $(find src -name "*.java")
          
      # 4. [UPDATED ACTION] Run SonarCloud Scan
      # This now uses the 'sonarqube-scan-action' as your log suggested
      # It will automatically read your new 'sonar-project.properties' file
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}